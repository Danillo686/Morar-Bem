[package]
name = "morar-bem-back"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros"] }
vercel_runtime = "2"

[[bin]]
name = "lista"
path = "api/lista.rs"

[[bin]]
name = "lead"
path = "api/lead.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
